name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: pixelforge_test
          POSTGRES_USER: pixelforge_test
          POSTGRES_PASSWORD: pixelforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixelforge_test -d pixelforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          platforms: linux/amd64
          load: true
          tags: pixelforge-ci:test
          cache-from: type=gha,scope=pixelforge
          cache-to: type=gha,scope=pixelforge,mode=max

      - name: Run PHP lint, static analysis and tests
        env:
          TEST_DATABASE_URL: postgres://pixelforge_test:pixelforge_test@127.0.0.1:5432/pixelforge_test?sslmode=disable
        run: |
          docker run --rm --network host --entrypoint sh \
            -e APP_ENV=testing \
            -e TEST_DATABASE_URL \
            pixelforge-ci:test -ec '
              cp .env.example .env
              php artisan key:generate
              composer test
            '

  publish:
    name: Publish image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pixelforge
          cache-to: type=gha,scope=pixelforge,mode=max

  deploy:
    name: Deploy to production
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    environment:
      name: production
      url: https://px.bit-monkey.io

    steps:
      - name: Trigger Dokploy deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
        run: |
          status=$(curl -sS --max-time 30 -X POST -o response.json -w '%{http_code}' "$DEPLOY_WEBHOOK_URL")
          if [ "$status" != 200 ]; then
            echo "::error::Dokploy deploy webhook returned HTTP $status: $(head -c 300 response.json)"
            exit 1
          fi

      - name: Wait for the new revision to serve traffic
        run: |
          for _ in $(seq 60); do
            revision=$(curl -sS --max-time 10 -o /dev/null -D - https://px.bit-monkey.io/up \
              | tr -d '\r' | awk -F': ' 'tolower($1) == "x-app-revision" { print $2 }') || true
            if [ "$revision" = "$GITHUB_SHA" ]; then
              echo "Production is serving $revision."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production still reports revision '${revision:-none}' after 10 minutes, not $GITHUB_SHA."
          exit 1
