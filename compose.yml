services:
    app:
        build:
            context: .
        image: pixelforge-app
        env_file:
            - .env
        expose:
            - '80'
        volumes:
            - storage:/app/storage
            - type: bind
              source: ./.env
              target: /app/.env
              read_only: true
              bind:
                  create_host_path: false
        stop_grace_period: 70s
        restart: unless-stopped

volumes:
    storage:
